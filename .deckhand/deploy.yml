# Deckhand deploy manifest — the contract this project exposes to the external
# Deckhand blue-green delivery system. Regenerated by `pnpm setup`; disable the
# deckhand dimension to remove it. Spec: the Deckhand repo docs/contracts/deploy-manifest.md.
#
# PRODUCTION REQUIREMENTS the app enforces (see docs/adts/0010-deploy-model):
# - DATABASE_URL and REDIS_URL MUST use TLS in production (Postgres
#   sslmode=require; Redis rediss://) — the API/worker config fail fast
#   otherwise. Prefer a managed TLS datastore. Self-hosted: Postgres accepts
#   a self-signed cert with sslmode=require, but Redis (ioredis) verifies
#   the cert, so give Redis a trusted (not self-signed) cert.
apiVersion: deckhand/v1

project:
  slug: ex-mio
  displayName: 'ex-mio-games'
  repo: your-org/ex-mio # owner/name on GitHub — set before first deploy

# CI gate — the starter already exposes these as root scripts.
pipeline:
  install: 'pnpm install --frozen-lockfile'
  build: 'pnpm build'
  lint: 'pnpm lint'
  test: 'pnpm test'
  extra: ['pnpm lint:fsd']

# Images built in CI and pushed to the registry (never built on the prod host).
build:
  context: . # monorepo → build context is the repo root
  registry: ghcr.io/your-org # GHCR (private) — set your org
  images:
    - name: api
      dockerfile: apps/api/Dockerfile
    - name: web
      dockerfile: apps/web/Dockerfile
      # The web image is domain-agnostic — no build args. The browser talks to
      # the API on the SAME ORIGIN (single_host: true routes the API paths above
      # to the API), and the SSR base is read at runtime from API_URL
      # (services.web.env below). One image promotes dev -> prod with no rebuild.
      # (For single_host: false, bake NEXT_PUBLIC_API_URL here, or have the client
      # read PUBLIC_API_URL from the runtime /config endpoint.)

services:
  api:
    image: api
    strategy: blue-green
    port: 4000 # INTERNAL container port (no host port)
    health:
      live: /healthz/live # 200, no dependencies
      ready: /healthz/ready # 503 when the DB is down — gates blue-green cutover
    public:
      paths: ['/api/*', '/socket.io/*', '/healthz*', '/docs*']
    resources: { cpu: '0.5', memory: '512M' }
    depends_on: [db, redis]
  web:
    image: web
    strategy: blue-green
    port: 3000
    health:
      # The starter ships this as a web route (app/health/route.ts). It resolves
      # on web, NOT the API's /healthz (which the api paths above route to the API).
      # Returns 200 {status:"ok", version:<APP_VERSION>}.
      ready: /health
    public:
      paths: ['/*'] # everything else → web
    env:
      # Server-side (SSR) base for the web -> API calls, read at RUNTIME.
      # Internal service URL (no host port), so SSR never egresses to the proxy.
      # Unset -> the SSR health card degrades to "unreachable" (never crashes);
      # the browser is unaffected (it uses the same origin).
      API_URL: 'http://api:4000'
    resources: { cpu: '0.5', memory: '512M' }
  db:
    image: postgres:16
    strategy: singleton # stateful → NOT blue-green
    internal: true # no host port; reachable only on the docker network
    port: 5432
    volumes: ['pgdata:/var/lib/postgresql/data']
    env:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    resources: { cpu: '1', memory: '1G' }
  redis:
    image: redis:7
    strategy: singleton
    internal: true
    port: 6379
    volumes: ['redisdata:/data']

domains:
  base: '${PROJECT_SLUG}.${DECKHAND_BASE_DOMAIN}'
  single_host: true # path-based routing (one subdomain). false → per-service subdomains.

# Env INVENTORY — names only. Values are injected by Deckhand from its host secret store.
env:
  required:
    [
      'DATABASE_URL',
      'CORS_ORIGIN',
      'REDIS_URL',
      'POSTGRES_DB',
      'POSTGRES_USER',
      'POSTGRES_PASSWORD',
      'FIREBASE_PROJECT_ID',
      'FIREBASE_CLIENT_EMAIL',
      'FIREBASE_PRIVATE_KEY',
    ]
  optional: ['API_URL']
  # Browser API base, resolved at runtime by the /config endpoint. Unset =>
  # same origin (the single_host default). Set only for single_host: false.
  runtime_public: ['PUBLIC_API_URL']
  # No longer required — the web image is domain-agnostic. NEXT_PUBLIC_API_URL
  # is only an OPTIONAL build-time fallback to bake an absolute browser API URL.
  public_build: []

version:
  source: git-tag
  inject_as: APP_VERSION # flows into the /healthz version field

migrations:
  run: 'pnpm --filter api migration:run'
  when: expand-before-cutover # expand (additive) BEFORE cutover; contract in the NEXT deploy
  backward_compatible: true # REQUIRED for blue-green: blue must run against the expanded schema
  backup_before: true # DB snapshot before expand
  breaking: false # true → maintenance-window path, not blue-green
  timeout: 300

deploy:
  target: default # server name from the Deckhand registry
  healthcheck_timeout: 120 # wait for ready on each public service before cutover (s)
  drain_timeout: 30
  rollback: auto # auto-rollback if green never becomes ready
