name: ci

# Proves that a clean clone works with no accounts and no repository secrets:
# job "checks" runs the prompt check, format, lint, typecheck and unit tests; job "stack" brings the
# whole docker compose stack up and runs the compose tests, the Postgres suites and the demo.
# Profile, tiers, triggers and the Dependabot policy: docs/ci.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository and no secret is used.
permissions:
  contents: read

# Every action is pinned to a full commit SHA; the tag is in the trailing comment.
jobs:
  checks:
    name: prompts, format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      # Docs-only change? Then the stack job is skipped (prettier below still checks the Markdown).
      # Fail-closed: if the diff cannot be computed the job fails, it never reports "no code".
      - name: Docs-only change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          n="$(printf '%s\n' "$changed" | grep -cvE '(\.md$|^docs/)' || true)"
          echo "changed files: $(printf '%s\n' "$changed" | grep -c . || true), non-docs: $n"
          echo "code=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Dependency diff of the PR (base to head): vulnerable versions, licences, package age.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      # Hermetic, seconds: role prompts and agent wrappers (bash and python3 only).
      - run: bash ci/check-prompts.sh

      # pnpm comes from corepack, at the version in package.json "packageManager".
      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm nx run-many -t lint --parallel=2

      - run: pnpm nx run-many -t typecheck --parallel=2

      - run: pnpm nx run-many -t test --parallel=2

  stack:
    name: stack comes up healthy, compose tests pass
    needs: checks
    # Skipped for a docs-only change and for Dependabot PRs: a bump gets the cheap job on its PR and
    # the full stack on the combined branch and on main (docs/ci.md, "Dependabot").
    if: needs.checks.outputs.code == 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The archify submodule is docs-only and large: do not fetch it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # docker-compose.yml carries a working local default for every variable, so
      # no .env is needed; copy one only if the repository ships a root example.
      - name: Local environment file
        run: if [ -f .env.example ]; then cp .env.example .env; fi

      - name: Start the stack and wait for every container to be healthy
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Compose tests (health, roles, tenancy, idempotency, bus)
        run: pnpm test:compose

      # Money and row-level-security proofs against the compose Postgres. The payments
      # suites connect as payments_app / payments_owner themselves (defaults in
      # apps/payments/src/testing/pg.ts, same as docker/postgres/init.sh); the migrations were
      # applied by the payments container at start.
      - name: Payments Postgres suites (ledger, RLS)
        run: pnpm --filter @ex-mio/payments test:db
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '54329'

      # The store contract the in-memory fake also passes, against the real Postgres store,
      # as the runtime role engagement_app (not the owner, RLS forced). The app role owns nothing, so it
      # cannot migrate: the schema is applied by the owner role first (idempotent; the container already
      # did it at start), then the tests run as the app role.
      - name: Engagement migrations as the owner role
        run: >
          docker compose exec -T
          -e MIGRATION_DATABASE_URL=postgresql://engagement_owner:engagement-owner-dev@postgres:5432/engagement
          engagement node dist/migrate.js

      - name: Engagement Postgres store contract (RLS)
        run: pnpm --filter @ex-mio/engagement test:pg
        env:
          DATABASE_URL: postgresql://engagement_app:engagement-app-dev@localhost:54329/engagement

      # The demo is part of the proof: a missing script is a red run, not a silent skip.
      - name: Demo
        run: bash scripts/demo.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop and remove the stack
        if: always()
        run: docker compose down -v
