name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. nrwl/nx-set-shas reads the last successful run through the
# Actions API (needs actions:read); nothing here writes to the repository.
permissions:
  contents: read
  actions: read

# Every action is pinned to a commit SHA (the tag is in the trailing comment).
jobs:
  check:
    name: format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5

      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-

      - run: pnpm nx format:check --base=$NX_BASE --head=$NX_HEAD

      - run: pnpm nx affected -t lint --parallel=2

      - run: pnpm nx affected -t typecheck --parallel=2

      - run: pnpm nx affected -t test --parallel=2

  compose:
    name: stack comes up healthy, compose tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No external account needed: the stack is self-contained.
      - name: Start the stack and wait for every container to be healthy
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Compose tests (health, roles, tenancy, idempotency, bus)
        run: pnpm test:compose

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop and remove the stack
        if: always()
        run: docker compose down -v
